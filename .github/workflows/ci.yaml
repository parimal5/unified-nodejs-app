name: Node.js CI

on:
  push:
    branches:
      - main
    paths:
    - 'server.js'
    - 'server.test.js'
    - 'package.json'
    - 'package-lock.json'
  pull_request:
    branches:
      - main
    paths:
    - 'server.js'
    - 'server.test.js'
    - 'package.json'
    - 'package-lock.json'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
      
      - name: Inspect environment
        run: |
          echo $NODE_ENV
      - name: Need Step Print
        run: "echo ${{need.repository-check.output.app_version}}"
        
    needs: repository-check
  repository-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f package.json
          test -f package-lock.json
          echo "Project files verified"  
      
      - name: Generate application version
        id: version
        run: echo "app_version=1.0.0" >> "$GITHUB_OUTPUT"
  outputs:
    app_version: ${{ steps.version.outputs.app_version }}      