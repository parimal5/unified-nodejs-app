
name: Node.js CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read
  security-events: write
  packages: write

jobs:
  nodejs-ci:
    name: Node.js CI
    uses: parimal5/globle-unified-pipeline/.github/workflows/nodejs-ci.yaml@main
    with:
      node-version: '22'
