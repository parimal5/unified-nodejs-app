name: Node.js CI

on:
  push:
    branches:
      - main
    paths:
      - 'server.js'
      - 'server.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/**'
  pull_request:
    branches:
      - main
    paths:
      - 'server.js'
      - 'server.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/**'

jobs:
  repository-check:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f package.json
          test -f package-lock.json
          echo "Project files verified"  

      - name: Generate application version
        id: version
        run: echo "app_version=1.0.0" >> "$GITHUB_OUTPUT"
      
      - name: Create build package
        run: |
          mkdir -p dist
          echo "Application build output" > dist/app.txt
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-build
          path: dist/

  build:
    runs-on: ubuntu-latest
    needs: repository-check
    env:
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
      
      - name: Simulate test failure
        run: exit 1
      
      - name: Final diagnostic
        if: always()
        run: echo "Final diagnostic executed"

      - name: Failure notification
        if: failure()
        run: echo "The build encountered a failure!"
      
      - name: Inspect environment
        run: |
          echo $NODE_ENV

      - name: App Version
        run: echo "${{ needs.repository-check.outputs.app_version }}"
      
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: nodejs-build
          path: dist

      - name: Print Output
        run: |
          ls -A
          cat dist/app.txt


