
name: Node.js CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Set up Node.js project
        uses: parimal5/globle-unified-pipeline/actions/setup-node-project@main
        with:
          node-version: '22'

      - name: Run tests
        run: npm test
