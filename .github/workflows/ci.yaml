name: Node.js CI

permissions:
    contents: read
on:
  push:
    branches:
      - main
    paths:
      - 'server.js'
      - 'server.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/**'
  pull_request:
    branches:
      - main
    paths:
      - 'server.js'
      - 'server.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/**'

jobs:
  failure-report:
    runs-on: ubuntu-latest
    needs:
      - repository-check
      - build
    if: failure()

    steps:
      - name: Report pipeline failure
        run: echo "At least one required job failed!"

  repository-check:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f package.json
          test -f package-lock.json
          echo "Project files verified"  

      - name: Generate application version
        id: version
        run: echo "app_version=1.0.0" >> "$GITHUB_OUTPUT"
      
      - name: Create build package
        run: |
          mkdir -p dist
          echo "Application build output" > dist/app.txt
      
      # - name: Upload build artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: nodejs-build
      #     path: dist/

  build:
    runs-on: ubuntu-latest
    needs: repository-check
    strategy:
      matrix:
        node-version: [22, 24]
    env:
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
      
      # - name: Simulate test failure
      #   run: exit 1
      
      - name: Final diagnostic
        if: always()
        run: echo "Final diagnostic executed"

      - name: Failure notification
        if: failure()
        run: echo "The build encountered a failure!"
      
      - name: Inspect environment
        run: |
          echo $NODE_ENV

      - name: App Version
        run: echo "${{ needs.repository-check.outputs.app_version }}"

      - name: Inspect application configuration
        env:
          APP_ENVIRONMENT: ${{ vars.APP_ENVIRONMENT }}
          DEMO_API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: |
          echo "Environment: $APP_ENVIRONMENT"
          echo "API key is configured: $([ -n "$DEMO_API_KEY" ] && echo yes || echo no)"
      
      # - name: Download Artifact
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: nodejs-build
      #     path: dist

      # - name: Print Output
      #   run: |
      #     ls -A
      #     cat dist/app.txt


